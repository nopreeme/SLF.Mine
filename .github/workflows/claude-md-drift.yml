name: CLAUDE.md Drift Detection

on:
  schedule:
    - cron: '0 10 * * 1'   # Every Monday at 10:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run drift analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/drift-check.md)" \
            --allowedTools "Read,Write,Glob,Grep,Bash" \
            --max-turns 30 \
            2>&1 | tee drift-run.log
          echo "Claude run exit code: $?"

      - name: Check for documentation changes
        id: changes
        run: |
          git diff --name-only | grep -E '\.(md)$' > changed-docs.txt || true
          if [ -s changed-docs.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed docs:"
            cat changed-docs.txt
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No documentation drift detected — all good."
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-run-log
          path: drift-run.log
          retention-days: 14

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/drift-correction-${{ github.run_number }}
          base: main
          title: 'docs: automated CLAUDE.md drift correction'
          body-path: drift-changelog.md
          commit-message: |
            docs: fix documentation drift detected by automated check

            Automated drift check found factual inaccuracies in CLAUDE.md.
            See drift-changelog.md for details.
          labels: documentation,automated
          delete-branch: true
          sign-commits: false
